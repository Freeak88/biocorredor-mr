name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test -- --run

      - name: Archive Saint Henri Wayback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saint-henri-wayback-evidence
          path: tmp/saint-henri-wayback/
          if-no-files-found: ignore
          retention-days: 7

      - name: Production build
        run: npm run build
