name: CI

on:
  push:
    branches: [main, "fix/**", "feature/auditoria-territorial"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test -- --run

      - name: Setup Python for territorial QA
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install territorial geometry dependencies
        run: python -m pip install --disable-pip-version-check shapely==2.1.2 pyproj==3.7.2

      - name: Validate finalized Annex I parcel vectorization
        run: python scripts/validate_annex11819_final.py

      - name: Archive Saint Henri Wayback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saint-henri-wayback-evidence
          path: tmp/saint-henri-wayback/
          if-no-files-found: ignore
          retention-days: 7

      - name: Archive territorial audit probes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: territorial-audit-probes
          path: tmp/territorial-audit/
          if-no-files-found: ignore
          retention-days: 7

      - name: Production build
        run: npm run build
