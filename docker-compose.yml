services:
  web:
    build:
      context: .
      args:
        VITE_GEMINI_API_KEY: ${VITE_GEMINI_API_KEY}
    container_name: fungimap-web
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - proxy-net

  prerender:
    build: ./prerender
    container_name: fungimap-prerender
    restart: unless-stopped
    environment:
      - PB_URL=http://fungimap-pb:8090
      - APP_URL=https://map.funga.com.ar
      - MONEYSITE_URL=https://funga.com.ar
      - PORT=3000
    expose:
      - "3000"
    networks:
      - proxy-net
    depends_on:
      - pb

  pb:
    build: ./pocketbase
    container_name: fungimap-pb
    restart: unless-stopped
    volumes:
      - pb-data:/pb/pb_data
      - ./pocketbase/pb_migrations:/pb/pb_migrations
      - ./pocketbase/pb_hooks:/pb/pb_hooks
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-placeholder}
    expose:
      - "8090"
    networks:
      - proxy-net

volumes:
  pb-data:
    external: true
    name: fungimon_pb-data

networks:
  proxy-net:
    external: true
