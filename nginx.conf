server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA shell — short cache to allow updates while avoiding re-download
    location = /index.html {
        expires 5m;
        add_header Cache-Control "public, must-revalidate, max-age=300" always;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Static assets — immutable cache (hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker v5 — no cache ever
    location /service-worker.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Old sw.js — redirect to new service-worker.js
    location /sw.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        return 302 /service-worker.js;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
