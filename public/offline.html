<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biocorredor MR — Sin conexión</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Playfair Display", Georgia, serif;
      background: #F9F7F2;
      color: #2D4032;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .container {
      max-width: 400px;
      border: 2px solid #2D4032;
      padding: 40px 32px;
      box-shadow: 8px 8px 0 #2D4032;
    }
    h1 { font-size: 1.5rem; margin-bottom: 12px; font-style: italic; }
    p { font-family: "Inter", sans-serif; font-size: 0.875rem; line-height: 1.6; color: #2D4032aa; margin-bottom: 20px; }
    button {
      font-family: "Inter", sans-serif;
      font-weight: 900;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      border: 1px solid #2D4032;
      padding: 10px 24px;
      background: transparent;
      color: #2D4032;
      cursor: pointer;
    }
    button:hover { background: #2D4032; color: #F9F7F2; }
    .icon { font-size: 48px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🍄</div>
    <h1>Sin conexión</h1>
    <p>El Atlas no puede conectarse a la red. Los datos cacheados siguen disponibles. Vuelve a intentar cuando recuperes conexión.</p>
    <button onclick="window.location.reload()">Reintentar</button>
  </div>
</body>
</html>
