<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Biocorredor MR - Fallback de campo</title>
  <link rel="stylesheet" href="/field-fallback/fallback.css">
  <link rel="manifest" href="/field-fallback/manifest.webmanifest">
</head>
<body>
  <main class="shell">
    <header><div><small>MODO CONTINGENCIA</small><h1>Fallback de campo</h1><p class="muted">Sin PocketBase. Los datos quedan en este telefono.</p></div><button id="refresh" class="icon" title="Actualizar">↻</button></header>
    <section class="notice">Este formulario funciona sin internet. Las fotos originales se guardan como Blob en IndexedDB.</section>
    <section id="journey-create" class="panel"><h2>Nueva jornada local</h2><div class="grid"><label>ID de evento<input id="journey-event-id" value="MR-20260815"></label><label>Nombre<input id="journey-title" value="Relevamiento MR 15/08"></label><label>Equipo<input id="journey-team" value="TEAM-01"></label><label>Observador<input id="journey-observer" value="Observador piloto"></label><label>Sector operativo<input id="journey-site" value="SECTOR-02"></label><label>Dispositivo<input id="journey-device" value="DEVICE-01"></label><label>Version de protocolo<input id="journey-protocol" value="1.0"></label></div><button id="start">Crear jornada local</button></section>
    <section id="journey-active" class="panel hidden"><div class="row"><div><small id="journey-status"></small><h2 id="journey-name"></h2><p id="journey-meta" class="muted"></p><code id="journey-id"></code></div><button id="close-journey" class="secondary">Cerrar jornada</button></div></section>
    <div id="paper-detected" class="notice hidden"></div><section id="capture" class="panel hidden"><div class="tabs"><button id="kind-occurrence" class="selected">Observacion</button><button id="kind-change">Cambio territorial</button></div><label>Ficha en papel / QR <span class="muted">(opcional)</span><input id="paper-id" placeholder="MR-20260815-P017" autocomplete="off"></label><label>Descripcion objetiva<input id="description" value="Registro pendiente"></label><div id="biodiversity-fields"><div class="grid"><label>Categoria<select id="category"><option value="flora">Flora</option><option value="fauna">Fauna</option><option value="funga">Funga</option><option value="other">Otro</option></select></label><label>Grupo taxonomico<select id="group"><option value="other">Otro</option><option value="plant">Planta</option><option value="bird">Ave</option><option value="mammal">Mamifero</option><option value="arthropod">Artropodo</option><option value="fungi">Hongo</option></select></label><label>Certeza<select id="certainty"><option value="unknown">No sé</option><option value="probable">Probable</option><option value="confirmed">Confirmada</option></select></label><label>Ambiente<select id="environment"><option value="unknown">Desconocido</option><option value="loma">Loma</option><option value="media_loma">Media loma</option><option value="bajo_dulce">Bajo dulce</option><option value="bajo_salino_alcalino">Bajo salino/alcalino</option><option value="other">Otro</option></select></label><label>Abundancia<select id="abundance"><option value="unknown">Desconocida</option><option value="isolated">Aislada</option><option value="scarce">Escasa</option><option value="frequent">Frecuente</option><option value="abundant">Abundante</option><option value="dominant">Dominante</option></select></label><label>Fenologia<select id="phenology"><option value="unknown">No informada</option><option value="vegetative">Vegetativa</option><option value="flowering">Floracion</option><option value="fruiting">Fructificacion</option><option value="dry">Seca</option></select></label></div><label>Nombre cientifico <span class="muted">(opcional)</span><input id="scientific-name"></label></div><label id="change-wrap" class="hidden">Tipo de cambio<select id="change"><option value="other">Otro</option><option value="construction">Obra</option><option value="filling">Relleno</option><option value="clearing">Desmonte</option><option value="soil_movement">Movimiento de suelo</option></select></label><label>Notas<textarea id="notes"></textarea></label><div class="grid"><button id="gps" class="secondary">Capturar GPS</button><label class="file">Foto original<input id="photo" type="file" accept="image/*" capture="environment"></label><label class="file">Foto / escaneo de ficha<input id="paper-photo" type="file" accept="image/*" capture="environment"></label></div><p id="gps-status" class="muted">GPS pendiente; se puede guardar sin coordenadas.</p><button id="save">Guardar en este telefono</button></section>
    <section class="panel"><div class="row"><div><h2>Registros locales</h2><p id="counts" class="muted"></p></div><button id="export" class="secondary">Exportar ZIP</button></div><ul id="records"></ul><p id="message" class="message"></p></section>
  </main><script src="/field-fallback/fallback.js"></script>
</body>
</html>
