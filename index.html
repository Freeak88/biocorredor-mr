<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1C1917" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Funga Map — Atlas de Hongos</title>
    <script>
      window.onerror = function(msg, url, line, col, err) {
        var el = document.getElementById('js-error');
        if (el) {
          el.style.display = 'block';
          el.textContent = 'JS Error: ' + msg + ' at ' + url + ':' + line + ':' + col;
        }
        console.error(msg, url, line, col, err);
        return false;
      };
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('js-error');
        if (el) {
          el.style.display = 'block';
          el.textContent += '\nPromise: ' + (e.reason && e.reason.message || e.reason);
        }
      });
    </script>
  </head>
  <body>
    <div id="root">
      <div id="js-error" style="display:none; padding:20px; font-family:monospace; font-size:12px; color:#c00; white-space:pre-wrap; background:#fee; margin:10px; border:2px solid #c00;"></div>
    </div>
    <script>
      // Force unregister any old service worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(reg) { reg.unregister(); });
          if (regs.length > 0) {
            console.log('[SW] Unregistered ' + regs.length + ' old service workers');
            // Hard reload to clear caches
            if (window.caches) {
              caches.keys().then(function(names) {
                names.forEach(function(n) { caches.delete(n); });
                location.reload();
              });
            }
          }
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
