    <script>
      window.onerror = function(msg, url, line, col, err) {
        var el = document.getElementById('js-error');
        if (el) {
          el.style.display = 'block';
          el.textContent = 'JS Error: ' + msg + ' at ' + url + ':' + line + ':' + col;
        }
        console.error(msg, url, line, col, err);
        return false;
      };
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('js-error');
        if (el) {
          el.style.display = 'block';
          el.textContent += '\nPromise: ' + (e.reason && e.reason.message || e.reason);
        }
      });
    </script>

  <body>
    <div id="root">
      <div id="js-error" style="display:none; padding:20px; font-family:monospace; font-size:12px; color:#c00; white-space:pre-wrap; background:#fee; margin:10px; border:2px solid #c00;"></div>
    </div>
    <script>
      // Force unregister any old service worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(reg) { reg.unregister(); });
          if (regs.length > 0) {
            console.log('[SW] Unregistered ' + regs.length + ' old service workers');
            // Hard reload to clear caches
            if (window.caches) {
              caches.keys().then(function(names) {
                names.forEach(function(n) { caches.delete(n); });
                location.reload();
              });
            }
          }
        });
      }
    </script>
